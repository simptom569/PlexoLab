[package]
name = "domain"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
getrandom = "0.4.3"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"], default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
