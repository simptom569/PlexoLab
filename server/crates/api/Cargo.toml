[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
tokio = { version = "1.53.3", features = ["net", "signal"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"

[dev-dependencies]
http-body-util = "0.1.5"
tokio = { version = "1.53.3", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }
