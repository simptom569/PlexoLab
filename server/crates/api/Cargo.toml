[package]
name = "api"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart", "ws"] }
db = { version = "0.1.0", path = "../db" }
domain = { version = "0.1.0", path = "../domain" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde", "serde-well-known"] }
tokio = { version = "1.53.3", features = ["fs", "io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
utoipa = { version = "6.0.0", features = ["uuid", "time"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.28.0", features = ["serde"] }

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1.5"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "migrate", "macros"] }
tokio = { version = "1.53.3", features = ["macros", "rt"] }
tokio-tungstenite = "0.29.0"
tower = { version = "0.5.3", features = ["util"] }
