[package]
name = "db"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
domain = { version = "0.1.0", path = "../domain" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "migrate", "macros"] }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.53.3", features = ["macros", "rt"] }
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
time = { version = "0.3.55", features = ["macros"] }
