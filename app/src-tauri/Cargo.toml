[package]
name = "plexolab"
version = "0.1.0"
description = "PlexoLab: рабочее пространство команды"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
