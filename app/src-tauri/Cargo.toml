[package]
name = "plexolab"
version = "0.1.0"
description = "PlexoLab: рабочее пространство команды"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri-plugin-store = "2.5.0"
tauri-plugin-http = "2.8.3"
keyring-core = "1.0.1"
tauri-plugin-opener = "2.7.2"

[target."cfg(windows)".dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[dev-dependencies]
uuid = { version = "1.28.0", features = ["v4"] }
