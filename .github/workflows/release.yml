# Релиз: тег вида v0.1.0 → быстрые проверки и полный e2e → установщик Windows (NSIS .exe) на странице Releases.
# Кнопка «Run workflow» (без тега) делает то же самое, но не выкладывает релиз: установщик остаётся артефактом запуска.
#
# Как выпустить: поднять версию в app/src-tauri/tauri.conf.json и app/src-tauri/Cargo.toml, закоммитить, затем
#   git tag v0.1.0 && git push origin v0.1.0
# Тег должен совпасть с версией приложения, иначе сборка остановится.

name: Релиз

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Проверки
    uses: ./.github/workflows/ci.yml

  e2e:
    name: Полные тесты
    uses: ./.github/workflows/e2e.yml

  windows:
    name: Установщик Windows
    needs: [checks, e2e]
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # создать релиз и приложить к нему установщик
    steps:
      - uses: actions/checkout@v4

      - name: Тег совпадает с версией приложения
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' app/src-tauri/Cargo.toml | head -1)
          echo "тег: $tag, tauri.conf.json: $conf, Cargo.toml: $crate"
          if [ "$tag" != "$conf" ] || [ "$tag" != "$crate" ]; then
            echo "::error::Версия в теге ($tag) не совпадает с tauri.conf.json ($conf) или Cargo.toml ($crate)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci --prefix app

      # Сборка и, если это тег, выкладка в Releases. targets=nsis и createUpdaterArtifacts заданы в tauri.conf.json.
      # Ключ подписи обновлений (секреты репозитория): без него сборка с createUpdaterArtifacts останавливается.
      # tauri-action сам кладёт в релиз подпись установщика и latest.json, из которого приложения узнают о новой версии.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: PlexoLab ${{ github.ref_name }}
          releaseBody: |
            Установщик PlexoLab для Windows. Если PlexoLab уже стоит, он сам предложит обновиться: «Настройки», «О программе».

            Установщик не подписан сертификатом, поэтому при первом запуске Windows SmartScreen покажет «Неизвестный издатель». Нажмите «Подробнее», затем «Выполнить в любом случае».
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      # Установщик и отдельным артефактом запуска: так его можно скачать и без релиза (запуск вручную)
      - uses: actions/upload-artifact@v4
        with:
          name: PlexoLab-windows-installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
